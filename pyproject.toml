[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-experiments-feature-selection-poc"
version = "0.1.0"
description = "Feature Selection POC framework for regression scorebooks, feature graphs, and model-based pruning."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.3,<2.0",
  "pyyaml>=6.0,<7.0",
  "pyarrow>=14.0,<15.0",
]

[project.optional-dependencies]
models = ["lightgbm>=4.1,<5.0", "catboost>=1.2,<2.0", "interpret>=0.5,<0.6", "shap>=0.44,<0.50"]
graph = ["networkx>=3.0", "neo4j>=5.0"]
dev = ["pytest>=7.4,<10.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["feature_selection_poc*"]
